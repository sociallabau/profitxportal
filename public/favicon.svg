<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <defs>
    <!-- Brand violet, lit from the top-left -->
    <linearGradient id="body" x1="8" y1="4" x2="56" y2="60" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#B066FF"/>
      <stop offset="0.5" stop-color="#8536F5"/>
      <stop offset="1" stop-color="#4C17C2"/>
    </linearGradient>
    <!-- Soft sheen across the top edge -->
    <linearGradient id="sheen" x1="32" y1="2" x2="32" y2="34" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity="0.38"/>
      <stop offset="1" stop-color="#FFFFFF" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="letter" x1="32" y1="14" x2="32" y2="50" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#FFFFFF"/>
      <stop offset="1" stop-color="#EDE3FF"/>
    </linearGradient>
    <filter id="lift" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="1.4" stdDeviation="1.4" flood-color="#2A0A6B" flood-opacity="0.45"/>
    </filter>
    <clipPath id="tile">
      <rect x="2" y="2" width="60" height="60" rx="17"/>
    </clipPath>
  </defs>

  <rect x="2" y="2" width="60" height="60" rx="17" fill="url(#body)"/>
  <g clip-path="url(#tile)">
    <ellipse cx="22" cy="6" rx="38" ry="22" fill="url(#sheen)"/>
  </g>
  <rect x="2.5" y="2.5" width="59" height="59" rx="16.5" fill="none" stroke="#FFFFFF" stroke-opacity="0.22"/>

  <!-- A bold italic P, drawn as a path so it renders without any font -->
  <path
    transform="translate(32 32) skewX(-9) translate(-34.5 -32)"
    fill="url(#letter)"
    fill-rule="evenodd"
    filter="url(#lift)"
    d="M20 13.5 H36.5 A12.25 12.25 0 0 1 36.5 38 H29.6 V50.5 H20 Z M29.6 21.8 H35.6 A4.35 4.35 0 0 1 35.6 30.5 H29.6 Z"
  />
</svg>
